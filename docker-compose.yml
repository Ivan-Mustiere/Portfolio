services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      DOCKER_BACKEND_URL: http://docker-backend:4000
      DOCKER_BACKEND_SECRET: ${DOCKER_BACKEND_SECRET:-change-me}
    depends_on:
      - docker-backend
    restart: unless-stopped

  docker-backend:
    build:
      context: ./docker-backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      BACKEND_SECRET: ${DOCKER_BACKEND_SECRET:-change-me}
      FRONTEND_URL: http://frontend:3000
    volumes:
      # Mount the Docker socket so the backend can manage containers on the host
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
